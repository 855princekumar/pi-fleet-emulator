name: Release

# Push a tag like v1.2.3 to build, publish to Docker Hub and create a GitHub Release.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (Docker Hub personal access token, Read & Write & Delete scope).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  NAMESPACE: devprincekumar
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag matches the versions in the repo
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          fail=0
          grep -q "devprincekumar/pi-fleet-spawner:$V" docker-compose.hub.yml || { echo "::error::docker-compose.hub.yml spawner tag is not $V"; fail=1; }
          grep -q "devprincekumar/pi-fleet-node:$V"    docker-compose.hub.yml || { echo "::error::docker-compose.hub.yml node tag is not $V"; fail=1; }
          grep -q "badge/version-$V-"                  README.md              || { echo "::error::README version badge is not $V"; fail=1; }
          exit $fail

  images:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: pi-fleet-node
            context: node-base
            title: Pi Fleet Emulator Node
            description: "Simulated Raspberry Pi node: real OpenSSH + Node-RED, reports aarch64/armv7l and Raspberry Pi OS."
            base: docker.io/library/ubuntu:22.04
            readme: docker/DOCKERHUB-node.md
          - name: pi-fleet-spawner
            context: .
            title: Pi Fleet Emulator Spawner
            description: "Spawn, scale and validate a simulated Raspberry Pi fleet in Docker. Real SSH + Node-RED per node."
            base: docker.io/library/python:3.11-slim
            readme: docker/DOCKERHUB-spawner.md
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=true
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.authors=855princekumar
            org.opencontainers.image.vendor=855princekumar
            org.opencontainers.image.url=https://hub.docker.com/r/${{ env.NAMESPACE }}/${{ matrix.name }}
            org.opencontainers.image.documentation=https://github.com/855princekumar/pi-fleet-emulator#readme
            org.opencontainers.image.base.name=${{ matrix.base }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.authors=855princekumar

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.check-version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/${{ matrix.name }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ matrix.readme }}

  github-release:
    needs: [check-version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check-version.outputs.version }}
        run: |
          MAJOR="${V%%.*}"; MINOR="${V#*.}"; MINOR="${MINOR%%.*}"
          cat > notes.md <<EOF
          ## Docker images

          | Image | Tags | Platforms |
          |---|---|---|
          | [\`$NAMESPACE/pi-fleet-spawner\`](https://hub.docker.com/r/$NAMESPACE/pi-fleet-spawner) | \`$V\`, \`$MAJOR.$MINOR\`, \`$MAJOR\`, \`latest\` | amd64, arm64 |
          | [\`$NAMESPACE/pi-fleet-node\`](https://hub.docker.com/r/$NAMESPACE/pi-fleet-node) | \`$V\`, \`$MAJOR.$MINOR\`, \`$MAJOR\`, \`latest\` | amd64, arm64 |

          Built from \`${GITHUB_SHA::7}\` with OCI labels, SBOM and provenance attestations.

          ## Quick start

          \`\`\`bash
          curl -O https://raw.githubusercontent.com/855princekumar/pi-fleet-emulator/$GITHUB_REF_NAME/docker-compose.hub.yml
          docker compose -f docker-compose.hub.yml up -d
          docker exec pi-fleet-spawner pfe spawn 3 --validate
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Pi Fleet Emulator $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes \
            docker-compose.hub.yml
