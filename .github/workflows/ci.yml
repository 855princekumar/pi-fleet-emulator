name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile spawner/app.py spawner/pfe.py run.py
      - name: Shell syntax
        run: for f in node-base/scripts/*.sh; do bash -n "$f"; done
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.hub.yml config --quiet

  smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PFE: docker exec pi-fleet-spawner pfe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start spawner (build from source)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7070/api/health >/dev/null && break; sleep 2; done
          $PFE health

      - name: Spawn 2 nodes and validate (arch, OS, SSH, Node-RED, metrics, MQTT)
        run: $PFE spawn 2 --validate

      - name: Node data persists across stop / start
        run: |
          docker exec -u pi pi-emu-node-1 sh -c 'echo kept > /home/pi/ci.txt'
          $PFE stop
          $PFE scale 2 --validate
          test "$(docker exec pi-emu-node-1 cat /home/pi/ci.txt)" = kept

      - name: Fleet config persists across spawner restart
        run: |
          docker restart pi-fleet-spawner
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7070/api/health >/dev/null && break; sleep 2; done
          $PFE validate

      - name: Scale up to 3, then down to 2
        run: |
          $PFE scale 3 --validate
          $PFE scale 2 --validate
          test "$($PFE status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')" = 2

      - name: Verify host ports and export
        run: |
          curl -sf -o /dev/null http://127.0.0.1:4000/
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000; head -c 7 <&3' | grep -q SSH-2.0
          $PFE export | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['node_count']==2, d"

      - name: API refuses cross-site, DNS-rebinding and non-JSON requests
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          B=http://127.0.0.1:7070
          test "$(code -X POST -H 'Origin: http://evil.example' -H 'Content-Type: application/json' -d '{}' $B/api/clear-config)" = 403
          test "$(code -X POST -H 'Content-Type: text/plain' -d x $B/api/clear-config)" = 415
          test "$(code -H 'Host: attacker.example:7070' $B/api/export-edgeshell)" = 403
          test "$(docker ps -q --filter name=pi-emu- | wc -l)" = 2
          curl -sI $B/ | grep -qi '^x-frame-options: deny'

      - name: Nodes have unique SSH host keys and are bound to localhost
        run: |
          a=$(docker exec pi-emu-node-1 ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub)
          b=$(docker exec pi-emu-node-2 ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub)
          test "$a" != "$b"
          docker port pi-emu-node-1 22 | grep -q '^127.0.0.1:'

      - name: Reset removes nodes and all node volumes
        run: |
          $PFE reset --yes
          test -z "$(docker ps -q --filter name=pi-emu-)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=pi-fleet)"

      - name: Logs on failure
        if: failure()
        run: |
          docker logs pi-fleet-spawner || true
          docker logs pi-emu-node-1 || true

      - name: Tear down
        if: always()
        run: |
          $PFE reset --yes || true
          docker compose down -v

  security:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (checksum verified)
        run: |
          curl -sSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c
          tar -xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/

      - name: Build images
        run: |
          docker build -t pfe/spawner:ci .
          docker build -t pfe/node:ci node-base

      - name: No secrets in images
        run: |
          trivy image --quiet --scanners secret --exit-code 1 pfe/spawner:ci
          trivy image --quiet --scanners secret --exit-code 1 pfe/node:ci

      - name: No fixable CRITICAL vulnerabilities
        run: |
          trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 pfe/spawner:ci
          trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 pfe/node:ci

      - name: No CRITICAL misconfigurations
        run: trivy config --quiet --severity CRITICAL --exit-code 1 .

  release-dry-run:
    # Same pinned actions as release.yml, no login and no push, so action
    # upgrades are proven on every PR instead of at release time
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: pi-fleet-node
            context: node-base
          - name: pi-fleet-spawner
            context: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: devprincekumar/${{ matrix.name }}
          tags: type=sha
          labels: org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=0.0.0-dryrun
            REVISION=${{ github.sha }}
