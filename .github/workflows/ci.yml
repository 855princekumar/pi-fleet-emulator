name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile spawner/app.py spawner/pfe.py run.py
      - name: Shell syntax
        run: for f in node-base/scripts/*.sh; do bash -n "$f"; done
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.hub.yml config --quiet

  smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PFE: docker exec pi-fleet-spawner pfe
    steps:
      - uses: actions/checkout@v4

      - name: Start spawner (build from source)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7070/api/health >/dev/null && break; sleep 2; done
          $PFE health

      - name: Spawn 2 nodes and validate (arch, OS, SSH, Node-RED, metrics, MQTT)
        run: $PFE spawn 2 --validate

      - name: Node data persists across stop / start
        run: |
          docker exec -u pi pi-emu-node-1 sh -c 'echo kept > /home/pi/ci.txt'
          $PFE stop
          $PFE scale 2 --validate
          test "$(docker exec pi-emu-node-1 cat /home/pi/ci.txt)" = kept

      - name: Fleet config persists across spawner restart
        run: |
          docker restart pi-fleet-spawner
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7070/api/health >/dev/null && break; sleep 2; done
          $PFE validate

      - name: Scale up to 3, then down to 2
        run: |
          $PFE scale 3 --validate
          $PFE scale 2 --validate
          test "$($PFE status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')" = 2

      - name: Verify host ports and export
        run: |
          curl -sf -o /dev/null http://127.0.0.1:4000/
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000; head -c 7 <&3' | grep -q SSH-2.0
          $PFE export | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['node_count']==2, d"

      - name: Reset removes nodes and all node volumes
        run: |
          $PFE reset --yes
          test -z "$(docker ps -q --filter name=pi-emu-)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=pi-fleet)"

      - name: Logs on failure
        if: failure()
        run: |
          docker logs pi-fleet-spawner || true
          docker logs pi-emu-node-1 || true

      - name: Tear down
        if: always()
        run: |
          $PFE reset --yes || true
          docker compose down -v
