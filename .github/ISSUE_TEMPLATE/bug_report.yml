name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! For **security issues** use [private reporting](https://github.com/855princekumar/pi-fleet-emulator/security/advisories/new) instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose -f docker-compose.hub.yml up -d
        2. docker exec pi-fleet-spawner pfe spawn 3 --validate
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or git tag (e.g. 1.1.0)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker Hub images (docker-compose.hub.yml)
        - Built from source (docker compose up --build)
        - python run.py
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host OS and Docker version
      placeholder: "Windows 11, Docker Desktop 4.x / Engine 29.x"
  - type: textarea
    id: output
    attributes:
      label: Output
      description: "`pfe health`, `pfe validate` and relevant `docker logs` output."
      render: text
